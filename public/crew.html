<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Crew — Fleet Floor Control</title><link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="crew-wrap">
  <div id="joinCard" class="crew-card">
    <div class="eyebrow">CREW CONSOLE</div><h1>Join Fleet Room</h1>
    <div class="field"><label>Room code</label><input id="roomCode" maxlength="16"></div>
    <div class="field" id="shipField"><label>Your ship</label><select id="shipSelect"><option value="">Choose your ship...</option></select></div>
    <div id="qrShipNotice" class="crew-status" style="display:none">
      <div class="small-note">ASSIGNED SHIP</div><div id="qrShipLabel" class="big-ship-name"></div>
      <div class="small-note" style="margin-top:8px">Assigned automatically by your QR code.</div>
    </div>
    <button class="primary-wide" onclick="joinCrew()">Join as This Ship</button>
    <div id="joinMessage" class="message"></div>
  </div>
  <div id="consoleCard" class="crew-card" style="display:none">
    <div class="eyebrow">CREW CONSOLE</div>
    <div id="crewStatus" class="crew-status"><div class="small-note">YOUR SHIP</div><div id="shipName" class="big-ship-name"></div><div id="statusText" class="small-note" style="margin-top:8px"></div></div>
    <button id="requestButton" class="request-wide" onclick="requestFloor()">REQUEST FLOOR</button>
    <button id="cancelButton" class="cancel-wide" onclick="cancelRequest()" style="display:none">Cancel Request</button>
    <p class="small-note" style="text-align:center">Leave this page open during the discussion. Your screen updates automatically when the instructor recognizes your crew.</p>
  </div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const socket=io(); let roomCode="", shipId=null, state=null;
const params=new URLSearchParams(location.search);
const roomFromUrl=(params.get("room")||"").trim().toUpperCase();
const shipParam=params.get("ship"); let qrShipId=null;
if(shipParam!==null){const n=Number(shipParam);if(Number.isInteger(n)&&n>=1&&n<=15)qrShipId=n-1;}
document.getElementById("roomCode").value=roomFromUrl||localStorage.getItem("fleetRoom")||"";

const select=document.getElementById("shipSelect");
select.innerHTML='<option value="">Choose your ship...</option>';
for(let i=0;i<15;i++){const o=document.createElement("option");o.value=i;o.textContent=`Ship ${i+1}`;select.appendChild(o);}
if(qrShipId!==null){
  select.value=qrShipId; document.getElementById("shipField").style.display="none";
  document.getElementById("qrShipNotice").style.display="block";
  document.getElementById("qrShipLabel").textContent=`Ship ${qrShipId+1}`;
}

function joinCrew(){
  roomCode=document.getElementById("roomCode").value.trim().toUpperCase();
  shipId=qrShipId!==null?qrShipId:Number(select.value);
  if(!roomCode||!Number.isInteger(shipId)){document.getElementById("joinMessage").textContent="Enter the room code and choose your ship.";return;}
  socket.emit("join-crew",{roomCode,shipId},res=>{
    if(!res.ok){document.getElementById("joinMessage").textContent=res.error;return;}
    state=res.state;localStorage.setItem("fleetRoom",roomCode);
    document.getElementById("joinCard").style.display="none";document.getElementById("consoleCard").style.display="block";render();
  });
}
socket.on("state",s=>{if(s.code===roomCode){state=s;render();}});
function render(){
  if(!state||shipId===null)return;const ship=state.ships.find(s=>s.id===shipId);if(!ship)return;
  document.getElementById("shipName").textContent=ship.name;
  const card=document.getElementById("crewStatus"),req=document.getElementById("requestButton"),cancel=document.getElementById("cancelButton"),txt=document.getElementById("statusText");
  card.className="crew-status "+ship.status;
  if(ship.status==="idle"){txt.textContent="Standing by";req.style.display="block";cancel.style.display="none";}
  if(ship.status==="requested"){txt.textContent=`Request sent • Queue position ${state.queue.indexOf(shipId)+1}`;req.style.display="none";cancel.style.display="block";}
  if(ship.status==="active"){txt.textContent="YOU HAVE BEEN RECOGNIZED";req.style.display="none";cancel.style.display="none";}
}
function requestFloor(){socket.emit("request-floor",{roomCode,shipId});}
function cancelRequest(){socket.emit("cancel-request",{roomCode,shipId});}
</script></body></html>
